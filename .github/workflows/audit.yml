name: Security audit

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/audit.yml'
  # New advisories land against an unchanged lockfile too.
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
  # release.yml runs this before it builds a release.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on RustSec vulnerabilities. Unmaintained, unsound and yanked
      # crates are only reported as warnings.
      - name: Audit Cargo.lock
        run: cargo audit
